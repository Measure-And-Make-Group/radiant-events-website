<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>Rickya Fandino | Radiant Events Planning</title>
  <style>
    @font-face { font-family: Cormorant; src: url('../src/fonts/cormorant-garamond-latin-wght-normal.woff2'); font-weight: 300 700; }
    @font-face { font-family: Cormorant; src: url('../src/fonts/cormorant-garamond-latin-wght-italic.woff2'); font-weight: 300 700; font-style: italic; }
    @font-face { font-family: Montserrat; src: url('../src/fonts/montserrat-latin-wght-normal.woff2'); font-weight: 100 900; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #efe5d3; color: #442318; font-family: Montserrat, sans-serif; }
    main { width: 1200px; height: 630px; padding: 24px; display: grid; grid-template-columns: 420px minmax(0, 1fr); }
    img { width: 100%; height: 100%; object-fit: cover; object-position: center 22%; border-radius: 22px 0 0 22px; }
    .content { display: grid; align-content: center; padding: 60px; background: #d1beaf; border-radius: 0 22px 22px 0; }
    .location { margin: 0 0 20px; font-size: 18px; letter-spacing: .15em; font-weight: 700; }
    h1 { font-family: Cormorant, Georgia, serif; font-size: 124px; font-weight: 600; line-height: .82; letter-spacing: -.055em; margin: 0 0 30px; }
    h1 em { display: block; font-weight: 550; color: #7d3722; }
    .role { margin: 0; border-top: 2px solid #916d5a; padding-top: 22px; font-size: 23px; line-height: 1.5; font-weight: 650; }
  </style>
  <main>
    <img src="../public/images/rickya-fandino.webp" alt="Rickya Fandino" />
    <div class="content">
      <p class="location">ATLANTA, GEORGIA</p>
      <h1>Rickya <em>Fandino</em></h1>
      <p class="role">Founder of Radiant Events Planning<br />Event Consultant</p>
    </div>
  </main>
</html>
